<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guntas Dev Space</title>
  <meta name="description" content="Websites &amp; brand design">
  <meta property="og:title" content="Guntas Dev Space">
  <meta property="og:description" content="Websites &amp; brand design">
  <link rel="icon" href="avatar.png">
  <style>
    :root {
      --bg: #f6f5f2; --card: #ffffff; --text: #16161a; --muted: #6b6b76;
      --border: #e4e2dc; --accent: #16161a; --accent-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111114; --card: #1b1b20; --text: #f2f2f4; --muted: #9a9aa6;
        --border: #2a2a31; --accent: #f2f2f4; --accent-text: #111114;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; padding: 48px 16px;
    }
    main { width: 100%; max-width: 520px; text-align: center; }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
      border: 1px solid var(--border); background: var(--card);
    }
    h1 { font-size: 1.35rem; margin: 16px 0 4px; }
    .bio { color: var(--muted); margin: 0 0 28px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.link {
      display: block; padding: 16px 20px; border-radius: 14px;
      background: var(--card); color: var(--text); text-decoration: none;
      border: 1px solid var(--border); font-weight: 600;
      transition: transform .12s ease, border-color .12s ease;
    }
    a.link:hover, a.link:focus-visible { transform: translateY(-2px); border-color: var(--muted); }
    a.link.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    a.link small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
    a.link.primary small { color: inherit; opacity: .75; }
    section { margin-top: 28px; }
    section:first-of-type { margin-top: 0; }
    h2 { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
      font-weight: 600; margin: 0 0 12px; }
    footer { margin-top: 36px; color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <img class="avatar" src="avatar.png" alt="" onerror="this.style.display='none'">
    <h1 id="name"></h1>
    <p class="bio" id="bio"></p>
    <div id="sections"></div>
    <footer id="footer"></footer>
  </main>

  <script>
    // ✏️ Edit everything here — this is the only part you need to change.
    const PROFILE = {
      name: "Guntas Dev Space",
      bio: "Websites & brand design",
      sections: [
        {
          heading: "Work",
          links: [
            { title: "Work with me", subtitle: "Websites, branding, project takeovers", url: "https://guntasdevspace.com/#contact", primary: true },
          ],
        },
        {
          heading: "Travel",
          links: [
            { title: "Before you fly to Bali", subtitle: "Free one-page checklist", url: "checklist/" },
          ],
        },
      ],
    };

    document.title = PROFILE.name;
    document.getElementById("name").textContent = PROFILE.name;
    document.getElementById("bio").textContent = PROFILE.bio;
    document.getElementById("footer").textContent = "© " + new Date().getFullYear() + " " + PROFILE.name;

    const root = document.getElementById("sections");
    for (const sec of PROFILE.sections) {
      const section = document.createElement("section");
      if (sec.heading) {
        const h = document.createElement("h2");
        h.textContent = sec.heading;
        section.appendChild(h);
      }
      const list = document.createElement("ul");
      for (const l of sec.links) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.className = "link" + (l.primary ? " primary" : "");
        a.href = l.url;
        a.rel = "noopener";
        a.textContent = l.title;
        if (l.subtitle) {
          const sm = document.createElement("small");
          sm.textContent = l.subtitle;
          a.appendChild(sm);
        }
        li.appendChild(a);
        list.appendChild(li);
      }
      section.appendChild(list);
      root.appendChild(section);
    }
  </script>
</body>
</html>
